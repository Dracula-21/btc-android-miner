name: Build BTC Android Miner APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout BTC Android Miner
        uses: actions/checkout@v4
        with:
          repository: VirtusVerbis/BTC_Anrdoid_Miner
          path: miner

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;25.1.8937393 cmake;3.22.1'
          accept-android-sdk-licenses: true

      - name: Install Vulkan shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          glslangValidator --version

      - name: Patch Gradle and Project Settings
        working-directory: miner
        run: |
          # 1. Понижаем версию Gradle до стабильной 8.5 (8.13 может быть слишком новой для старых плагинов)
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.5-bin.zip|' gradle/wrapper/gradle-wrapper.properties

          # 2. Принудительно обновляем Android Gradle Plugin до версии, совместимой с Gradle 8.5
          # Ищем файл build.gradle и заменяем версию AGP
          find . -name "build.gradle" -exec sed -i 's/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.2.2/g' {} +
          
          # 3. Убеждаемся, что репозитории google() и mavenCentral() подключены в settings.gradle
          if [ -f settings.gradle ]; then
            if ! grep -q "google()" settings.gradle; then
              echo "Adding repositories to settings.gradle"
              sed -i '/dependencyResolutionManagement/i \        google()\n        mavenCentral()' settings.gradle || true
            fi
          fi

          # 4. Добавляем gradle.properties настройки для стабильной работы
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties

      - name: Build debug APK
        working-directory: miner
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: btc-android-miner-debug
          path: miner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
