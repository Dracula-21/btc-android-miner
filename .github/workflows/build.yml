name: Build BTC Android Miner APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GRADLE_OPTS: "-Dorg.gradle.internal.repository.max.tentatives=6 -Dorg.gradle.internal.repository.initial.backoff=5000"
    steps:
      - name: Checkout BTC Android Miner
        uses: actions/checkout@v4
        with:
          repository: VirtusVerbis/BTC_Anrdoid_Miner
          path: miner

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;25.1.8937393 cmake;3.22.1'
          accept-android-sdk-licenses: true

      - name: Install Vulkan shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          glslangValidator --version

      - name: Patch Gradle and Project Settings
        working-directory: miner
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-9.1.0-bin.zip|' gradle/wrapper/gradle-wrapper.properties
          find . -name "*.gradle" -o -name "*.gradle.kts" | xargs sed -i 's/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.2.2/g'
          find . -name "*.gradle" -o -name "*.gradle.kts" | xargs sed -i 's/com.android.application" version "[0-9.]*"/com.android.application" version "8.2.2"/g'
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties

      - name: Fix Native Libs Packaging
        working-directory: miner
        run: |
          if [ -f app/src/main/AndroidManifest.xml ]; then
            sed -i 's/ android:extractNativeLibs="true"//g' app/src/main/AndroidManifest.xml
          fi
          if [ -f app/build.gradle ]; then
            echo "" >> app/build.gradle
            echo "android {" >> app/build.gradle
            echo "    packagingOptions {" >> app/build.gradle
            echo "        jniLibs {" >> app/build.gradle
            echo "            useLegacyPackaging = true" >> app/build.gradle
            echo "        }" >> app/build.gradle
            echo "    }" >> app/build.gradle
            echo "}" >> app/build.gradle
          elif [ -f app/build.gradle.kts ]; then
            echo "" >> app/build.gradle.kts
            echo "android {" >> app/build.gradle.kts
            echo "    packagingOptions {" >> app/build.gradle.kts
            echo "        jniLibs {" >> app/build.gradle.kts
            echo "            useLegacyPackaging = true" >> app/build.gradle.kts
            echo "        }" >> app/build.gradle.kts
            echo "    }" >> app/build.gradle.kts
            echo "}" >> app/build.gradle.kts
          fi
          if [ -f app/build.gradle ]; then
            sed -i '/defaultConfig {/a \        ndk { abiFilters "arm64-v8a" }' app/build.gradle
          elif [ -f app/build.gradle.kts ]; then
            sed -i '/defaultConfig {/a \        ndk { abiFilters += listOf("arm64-v8a") }' app/build.gradle.kts
          fi

      - name: Build debug APK
        working-directory: miner
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -Pandroid.injected.build.abi=arm64-v8a --stacktrace --no-daemon

      - name: Find APK files
        working-directory: miner
        run: |
          echo "=== Ищем APK файлы ==="
          find . -type f -name "*.apk" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: btc-android-miner-debug
          # СТАВИМ ЗАГЛУШКУ, чтобы шаг не падал красным крестом, пока мы ищем путь
          path: miner/README.md
          if-no-files-found: warn
